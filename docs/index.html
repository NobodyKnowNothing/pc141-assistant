<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC141 Course Assistant</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#5d6670; --line:#d9dde2; --accent:#4b2e83; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e8eaed; --muted:#9aa3ad; --line:#2d333b; --accent:#a58be0; --accent-fg:#14161a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:15vh 16px 64px; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:12px 14px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:10px; }
  button { padding:12px 20px; font:inherit; font-weight:600; color:var(--accent-fg); background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #out { margin-top:24px; }
  #out p { margin:0 0 12px; }
  #out .muted { color:var(--muted); }
  details { margin-top:16px; border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:.9rem; }
  summary { cursor:pointer; color:var(--muted); font-weight:600; }
  details ol { margin:10px 0 0; padding-left:22px; }
  details li { margin:0 0 8px; }
  details .sec, details .meta { display:block; color:var(--muted); font-size:.85rem; }
  details a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <form id="f">
    <input id="q" type="text" maxlength="500" placeholder="Ask a question about PC141 or Laurier…" aria-label="Question" required autofocus>
    <button id="go" type="submit">Ask</button>
  </form>
  <div id="out" aria-live="polite"></div>
</main>
<script>
  const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
  const API_URL = LOCAL ? "http://127.0.0.1:8787" : "https://wlu-rag-api.nobodyknownothing.workers.dev";

  const out = document.getElementById("out"), go = document.getElementById("go"), q = document.getElementById("q");

  function el(tag, props = {}, ...kids) {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...kids.filter((k) => k != null && k !== false && k !== ""));
    return e;
  }
  const safeUrl = (u) => (/^https:\/\//.test(u) ? u : "#");

  function show(lines, muted = false, extra = null) {
    out.replaceChildren(...lines.map((t) => el("p", { textContent: t, className: muted ? "muted" : "" })), extra || "");
  }

  // A collapsed list of the sources the answer cites.
  function citations(data) {
    if (!Array.isArray(data.sources)) return null;
    const cited = new Set([...(data.pc141 || []), ...(data.laurier || [])].flatMap((c) => c.sources || []));
    const list = data.sources.filter((s) => cited.has(s.n));
    if (!list.length) return null;
    return el("details", {},
      el("summary", { textContent: `Citations (${list.length})` }),
      el("ol", {}, ...list.map((s) => {
        const pages = s.pages?.length ? `${s.pages.length > 1 ? "pp." : "p."} ${s.pages.join(", ")}` : "";
        return el("li", {},
          s.url ? el("a", { href: safeUrl(s.url), target: "_blank", rel: "noopener", textContent: s.title }) : s.title,
          s.section && el("span", { className: "sec", textContent: s.section }),
          el("span", { className: "meta", textContent: s.kind === "pc141" ? ["PC141 course document", pages].filter(Boolean).join(" · ") : "Official Laurier page" }));
      }))
    );
  }

  // Just the answer statements, without citations, quotes or verification details.
  function answerLines(data) {
    if (!Array.isArray(data.pc141)) return [data.answer || "No answer."];
    const lines = [...data.pc141, ...(data.laurier || [])].map((c) => c.text);
    return lines.length ? lines : ["Sorry, I couldn't find an answer to that."];
  }

  document.getElementById("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    go.disabled = true;
    show(["Thinking…"], true);
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q.value, scope: "both", mode: "full" }),
      });
      const data = await res.json();
      if (res.status === 429 || /\b4006\b|daily free allocation/.test(data.detail || "")) return show(["The assistant has reached today's usage limit. Please try again in a few hours."], true);
      if (!res.ok) throw new Error(data.detail || data.error || res.statusText);
      show(answerLines(data), false, citations(data));
    } catch (err) {
      show([`Something went wrong: ${err.message}`], true);
    } finally {
      go.disabled = false;
    }
  });
</script>
</body>
</html>
